name: CI Build
# Changes that only touch documentation or license text do not run CI.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # Version of the package built for the package smoke tests. It never exists on nuget.org.
  PACKAGE_VERSION: 0.0.0-ci.${{ github.run_id }}

jobs:
  job:
    strategy:
      matrix:
        # The oldest and the latest runner of each platform, so the packaged native libraries are
        # exercised at both ends. macos-15-intel is the only Intel macOS runner.
        os: [ubuntu-22.04, ubuntu-latest, ubuntu-22.04-arm, ubuntu-24.04-arm, macos-15-intel, macos-14, macos-latest, windows-2022, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      # The install occasionally crashes on the windows-11-arm runner, so a failed attempt is retried once.
      - name: Install .NET 8.0.x, 9.0.x and 10.0.x
        id: install-dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install .NET 8.0.x, 9.0.x and 10.0.x (retry)
        if: steps.install-dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Display dotnet info
        run: dotnet --list-sdks  
      - name: Run tests
        run: dotnet test src/PgSqlParser.Tests/PgSqlParser.Tests.csproj

  # Alpine uses musl instead of glibc, so it gets its own native library and its own test run.
  # The tests run through docker because the setup actions do not support Alpine containers.
  alpine:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Run tests on Alpine
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e PROTOBUF_PROTOC=/usr/bin/protoc \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine sh -c '
              set -e
              # Grpc.Tools bundles a glibc protoc, so use the Alpine one to compile pg_query.proto.
              apk add --no-cache bash curl protobuf
              # The image has the .NET 10 runtime; add 8 and 9 to cover every target framework.
              curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              bash /tmp/dotnet-install.sh --runtime dotnet --channel 8.0 --install-dir /usr/share/dotnet
              bash /tmp/dotnet-install.sh --runtime dotnet --channel 9.0 --install-dir /usr/share/dotnet
              dotnet --list-runtimes
              dotnet test src/PgSqlParser.Tests/PgSqlParser.Tests.csproj
            '

  # The native libraries are built on old OS versions so they load on everything newer. These jobs
  # run the tests at that old end. The tests are built on the runner, since the SDK that builds them
  # does not run on systems this old, and then run in the old container on .NET 8.
  floor:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        target:
          # Oldest Alpine release that .NET 8 supports, and what the musl libraries are built on.
          - name: alpine-3.17
            image: alpine:3.17
            rid_os: linux-musl
            prepare: apk add --no-cache bash curl icu-libs libstdc++ libgcc
          # glibc 2.26. The glibc libraries need 2.17, but .NET 8 itself needs 2.23 or newer.
          - name: amazonlinux-2
            image: amazonlinux:2
            rid_os: linux
            prepare: yum install -y -q tar gzip libicu
    name: floor (${{ matrix.target.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build tests for the target
        run: |
          case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; esac
          dotnet build src/PgSqlParser.Tests/PgSqlParser.Tests.csproj -f net8.0 \
            -p:PlatformRID=${{ matrix.target.rid_os }}-$arch
      - name: Run tests in ${{ matrix.target.image }}
        run: |
          docker run --rm -v "$PWD":/work -w /work -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            ${{ matrix.target.image }} sh -c '
              set -e
              ${{ matrix.target.prepare }}
              curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              bash /tmp/dotnet-install.sh --channel 8.0 --install-dir /usr/share/dotnet
              /usr/share/dotnet/dotnet test src/PgSqlParser.Tests/bin/Debug/net8.0/PgSqlParser.Tests.dll
            '

  # The jobs above test the project. The jobs below test the NuGet package: they pack it once and
  # then install it into src/PackageSmokeTest the way a client would, which checks the package
  # contents and the native library that NuGet and the runtime pick on each platform.
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack src/PgSqlParser/PgSqlParser.csproj -c Release -o artifacts/package -p:Version=$PACKAGE_VERSION
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/package
          retention-days: 1

  package:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      # The install occasionally crashes on the windows-11-arm runner, so a failed attempt is retried once.
      - name: Install .NET 8.0.x, 9.0.x and 10.0.x
        id: install-dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install .NET 8.0.x, 9.0.x and 10.0.x (retry)
        if: steps.install-dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts/package
      - name: Run package smoke test
        run: |
          for tfm in net8.0 net9.0 net10.0; do
            dotnet run --project src/PackageSmokeTest -f $tfm -p:PgSqlParserVersion=$PACKAGE_VERSION
          done
        shell: bash
      # Compiles the same app ahead of time into a native executable, which fails if the library
      # relies on anything Native AOT cannot do, such as runtime marshalling.
      - name: Run package smoke test with Native AOT
        run: |
          set -o pipefail
          dotnet publish src/PackageSmokeTest -f net10.0 -c Release --use-current-runtime \
            -p:PublishAot=true -p:PgSqlParserVersion=$PACKAGE_VERSION -o artifacts/aot | tee aot-publish.log
          # Trim and AOT warnings (IL...) mean something may break at run time, including in dependencies.
          if grep -q 'warning IL' aot-publish.log; then
            echo "Native AOT publish reported trim or AOT warnings"
            exit 1
          fi
          ./artifacts/aot/PackageSmokeTest
        shell: bash

  # The same smoke test inside Linux containers: Alpine (musl) on each .NET version, and the oldest
  # supported Alpine and glibc systems. The app is built on the runner as a portable app, so the
  # runtime in the container picks the native library, as it does for a client's deployment.
  package-containers:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts/package
      - name: Build package smoke test
        run: dotnet build src/PackageSmokeTest -p:PgSqlParserVersion=$PACKAGE_VERSION
      - name: Run in Alpine on .NET 8, 9 and 10
        run: |
          for version in 8.0 9.0 10.0; do
            docker run --rm -v "$PWD":/work -w /work mcr.microsoft.com/dotnet/runtime:$version-alpine \
              dotnet src/PackageSmokeTest/bin/Debug/net$version/PackageSmokeTest.dll
          done
      - name: Run in Alpine 3.17
        run: |
          docker run --rm -v "$PWD":/work -w /work alpine:3.17 sh -c '
            set -e
            apk add --no-cache bash curl icu-libs libstdc++ libgcc
            curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --runtime dotnet --channel 8.0 --install-dir /usr/share/dotnet
            /usr/share/dotnet/dotnet src/PackageSmokeTest/bin/Debug/net8.0/PackageSmokeTest.dll
          '
      - name: Run in Amazon Linux 2
        run: |
          docker run --rm -v "$PWD":/work -w /work amazonlinux:2 sh -c '
            set -e
            yum install -y -q tar gzip libicu
            curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --runtime dotnet --channel 8.0 --install-dir /usr/share/dotnet
            /usr/share/dotnet/dotnet src/PackageSmokeTest/bin/Debug/net8.0/PackageSmokeTest.dll
          '
