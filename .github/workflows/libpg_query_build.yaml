name: libpg_query Build
on:
  workflow_dispatch:

jobs:
  build-job:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifacts_path: "artifacts/linux-x64"
          - os: ubuntu-24.04-arm
            artifacts_path: "artifacts/linux-arm64"
          - os: windows-latest
            artifacts_path: "artifacts/win-x64"
          - os: macos-15-intel
            artifacts_path: "artifacts/osx-x64"  
          - os: macos-latest
            artifacts_path: "artifacts/osx-arm64"
      fail-fast: false
    runs-on: ${{ matrix.os }} 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Create artifacts folder
        run: |
          New-Item -Path ${{ matrix.artifacts_path }} -ItemType Directory -Force
        shell: pwsh
        working-directory: src
      - name: Setup Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build artifacts
        run: |
          if ($env:RUNNER_OS -eq 'Windows') {
              nmake /f Makefile.msvc build_shared
          } else {
              make -f Makefile build_shared
          }
          $extensions = @("dll","so","dylib")
          foreach ($ext in $extensions) {
            $file = "libpg_query.$ext"
            if (Test-Path $file) {
              Copy-Item -Path $file -Destination "../${{ matrix.artifacts_path }}/libpg_query.$ext" -Force
              break
            }
          }
        shell: pwsh
        working-directory: src/libpg_query
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: src/artifacts
          retention-days: 1
          overwrite: true
  
  create-single-artifact-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          Add-Content -Path $env:GITHUB_ENV -Value "date=$date"
        shell: pwsh
      - name: Download all artifacts
        run: |
          gh run download --repo ${{ github.repository }} --dir final-artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: restructure folders for single artifact
        run: |
          # Move all files and folders from 'build-artifacts' inside 'final-artifacts' to parent folder
          for dir in final-artifacts/build-artifacts*; do
            if [ -d "$dir" ]; then
              cp -R "$dir"/* final-artifacts/
              rm -rf "$dir"
            fi
          done
        shell: bash
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ env.date }}
          path: |
            final-artifacts/*
            !final-artifacts/artifacts-*
          retention-days: 1
      - name: Delete intermediate artifacts
        run: |
          for id in $(gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name | test("^artifacts-") | not) | .id'); do
            gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/$id
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
