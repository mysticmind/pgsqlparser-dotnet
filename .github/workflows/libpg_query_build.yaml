name: libpg_query Build
on:
  workflow_dispatch:

jobs:
  build-job:
    strategy:
      # Each library is built against the oldest OS baseline that is practical on GitHub runners, so it
      # loads on everything from that baseline up to the latest release:
      # - Linux: built inside a manylinux2014 container (glibc 2.17). The runner's own glibc would
      #   otherwise become the minimum required version.
      # - Alpine and other musl-based Linux: built inside an Alpine container, since a glibc library
      #   does not load on musl. 3.17 is the oldest Alpine release that .NET 8 supports.
      # - macOS: the deployment target sets the minimum OS version, independent of the runner.
      # - Windows: the CRT is linked statically, so only KERNEL32 is required.
      matrix:
        include:
          - os: ubuntu-22.04
            artifacts_path: "artifacts/linux-x64"
            container: quay.io/pypa/manylinux2014_x86_64
            max_glibc: "2.17"
          - os: ubuntu-22.04-arm
            artifacts_path: "artifacts/linux-arm64"
            container: quay.io/pypa/manylinux2014_aarch64
            max_glibc: "2.17"
          - os: ubuntu-22.04
            artifacts_path: "artifacts/linux-musl-x64"
            container: alpine:3.17
            container_prepare: apk add --no-cache build-base
            musl: true
          - os: ubuntu-22.04-arm
            artifacts_path: "artifacts/linux-musl-arm64"
            container: alpine:3.17
            container_prepare: apk add --no-cache build-base
            musl: true
          - os: windows-2022
            artifacts_path: "artifacts/win-x64"
          - os: macos-15-intel
            artifacts_path: "artifacts/osx-x64"
            macos_target: "10.15"
          - os: macos-14
            artifacts_path: "artifacts/osx-arm64"
            macos_target: "11.0"
      fail-fast: false
    runs-on: ${{ matrix.os }} 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Create artifacts folder
        run: |
          New-Item -Path ${{ matrix.artifacts_path }} -ItemType Directory -Force
        shell: pwsh
        working-directory: src
      - name: Setup Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build artifacts in container
        if: matrix.container != ''
        run: |
          # Strip debug info and unneeded symbols, which otherwise make up most of the file.
          docker run --rm -v "$PWD":/work -w /work/src/libpg_query ${{ matrix.container }} \
            sh -c "${{ matrix.container_prepare || 'true' }} && make -f Makefile build_shared -j4 && strip --strip-unneeded libpg_query.so"
          cp src/libpg_query/libpg_query.so "src/${{ matrix.artifacts_path }}/libpg_query.so"
        shell: bash
      - name: Build artifacts
        if: matrix.container == ''
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: |
          if ($env:RUNNER_OS -eq 'Windows') {
              nmake /f Makefile.msvc build_shared
          } else {
              make -f Makefile build_shared
          }
          $extensions = @("dll","so","dylib")
          foreach ($ext in $extensions) {
            $file = "libpg_query.$ext"
            if (Test-Path $file) {
              Copy-Item -Path $file -Destination "../${{ matrix.artifacts_path }}/libpg_query.$ext" -Force
              break
            }
          }
        shell: pwsh
        working-directory: src/libpg_query
      - name: Check minimum glibc version
        if: matrix.max_glibc != ''
        run: |
          lib="src/${{ matrix.artifacts_path }}/libpg_query.so"
          required=$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "Requires glibc $required (allowed: ${{ matrix.max_glibc }})"
          [ "$(printf '%s\n' "$required" "${{ matrix.max_glibc }}" | sort -V | tail -1)" = "${{ matrix.max_glibc }}" ]
        shell: bash
      - name: Check musl linkage
        if: matrix.musl
        run: |
          lib="src/${{ matrix.artifacts_path }}/libpg_query.so"
          needed=$(readelf -d "$lib" | grep NEEDED)
          echo "$needed"
          echo "$needed" | grep -q 'libc\.musl-'
          ! objdump -T "$lib" | grep -q 'GLIBC_'
        shell: bash
      - name: Check minimum macOS version
        if: matrix.macos_target != ''
        run: |
          lib="src/${{ matrix.artifacts_path }}/libpg_query.dylib"
          minos=$(otool -l "$lib" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
          echo "Requires macOS $minos (expected: ${{ matrix.macos_target }})"
          [ "$minos" = "${{ matrix.macos_target }}" ]
        shell: bash
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # Several entries share a runner, so the job index keeps the names unique.
          name: build-artifacts-${{ strategy.job-index }}
          path: src/artifacts
          retention-days: 1
          overwrite: true
  
  create-single-artifact-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          Add-Content -Path $env:GITHUB_ENV -Value "date=$date"
        shell: pwsh
      - name: Download all artifacts
        run: |
          gh run download --repo ${{ github.repository }} --dir final-artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: restructure folders for single artifact
        run: |
          # Move all files and folders from 'build-artifacts' inside 'final-artifacts' to parent folder
          for dir in final-artifacts/build-artifacts*; do
            if [ -d "$dir" ]; then
              cp -R "$dir"/* final-artifacts/
              rm -rf "$dir"
            fi
          done
        shell: bash
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ env.date }}
          path: |
            final-artifacts/*
            !final-artifacts/artifacts-*
          retention-days: 1
      - name: Delete intermediate artifacts
        run: |
          for id in $(gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name | test("^artifacts-") | not) | .id'); do
            gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/$id
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
